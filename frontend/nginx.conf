# ============================================================
# SmartLogix frontend (nginx) — configuración para Azure
# ============================================================
# En local, el frontend llama directo al gateway (http://localhost:8085).
# En Azure, el frontend y el gateway viven en dominios distintos
# (azurecontainerapps.io), lo que obliga a resolver CORS y CSP.
#
# Solución: proxy SAME-ORIGIN. El navegador solo llama a su propio origen
# (/api/...), y nginx reenvía internamente al gateway público. Como la
# petición nunca sale del origen, NO hay CORS ni CSP que configurar.
#
# La URL del gateway llega por variable de entorno SMARTLOGIX_GATEWAY_URL,
# que se expande al iniciar el contenedor (ver start-nginx.sh).
# ============================================================

server {
  listen 80;
  server_name _;

  # CSP: 'self' basta porque el navegador solo habla con su propio origen
  # (el proxy /api se encarga de hablar con el gateway).
  add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; object-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  add_header Referrer-Policy "no-referrer" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;

  root /usr/share/nginx/html;
  index index.html;

  # --- Proxy same-origin hacia el API Gateway -------------------
  # /api/** y /actuator/** se reenvían al gateway; el navegador nunca
  # ve la URL real del gateway, así que no hay preflight CORS.
  location /api/ {
    proxy_pass ${SMARTLOGIX_GATEWAY_URL}/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
  }

  location /actuator/ {
    proxy_pass ${SMARTLOGIX_GATEWAY_URL}/actuator/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
  }

  # --- SPA (React Router) --------------------------------------
  location / {
    try_files $uri $uri/ /index.html;
  }

  location ~* \.(?:js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
    expires 7d;
    try_files $uri =404;
  }
}
