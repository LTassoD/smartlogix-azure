# ============================================================
# SmartLogix shipping-service (despachos) - CONSUMIDOR de eventos Service Bus
# ============================================================

# Nombre y puerto de este microservicio.
spring.application.name=shipping-service
server.port=8083

# DevTools: sin reinicio automático / live reload.
spring.devtools.restart.enabled=false
spring.devtools.livereload.enabled=false

# ------------------------------------------------------------
# BASE DE DATOS: Postgres 5435 → BD smartlogix_shipping_db.
# ------------------------------------------------------------
spring.datasource.url=jdbc:postgresql://localhost:5435/smartlogix_shipping_db
spring.datasource.username=${SMARTLOGIX_DB_USERNAME:smartlogix}
spring.datasource.password=${SMARTLOGIX_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.connection-timeout=5000
spring.datasource.hikari.validation-timeout=3000
spring.datasource.hikari.maximum-pool-size=5

# JPA/Hibernate (crea/actualiza tablas; show-sql desactivado por rendimiento).
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false
logging.level.org.hibernate.SQL=INFO
logging.level.org.hibernate.orm.jdbc.bind=INFO
logging.level.org.springframework.boot.devtools=OFF

# Actuator: health e info.
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# ------------------------------------------------------------
# AZURE SERVICE BUS - CONEXION Y ESCUCHA DE EVENTOS (AMQP 1.0).
# Este servicio es un CONSUMIDOR via @JmsListener. Service Bus
# reemplaza a RabbitMQ como broker cloud (guia 2.2.x).
# ------------------------------------------------------------
smartlogix.servicebus.host=${SMARTLOGIX_SERVICEBUS_HOST:sb-smartlogix-ns.servicebus.windows.net}
smartlogix.servicebus.policy-name=${SMARTLOGIX_SERVICEBUS_POLICY:smartlogix-app}
smartlogix.servicebus.policy-key=${SMARTLOGIX_SERVICEBUS_KEY}

# Topico de eventos de pedido (sustituye al DirectExchange durable).
smartlogix.servicebus.orders-topic=smartlogix.orders.topic

# DESTINOS de escucha. En Service Bus las destinations usan la forma
# amqps://<host>/<topic>/Subscriptions/<subscription>; el client-id
# autogenerado por Qpid no sirve para direccionar (lo verificamos
# empíricamente: ningun mensaje llegaba a la subscription).
smartlogix.servicebus.shipping.created-subscription-destination=amqps://${smartlogix.servicebus.host}/${smartlogix.servicebus.orders-topic}/Subscriptions/shipping-created-sub
smartlogix.servicebus.shipping.cancelled-subscription-destination=amqps://${smartlogix.servicebus.host}/${smartlogix.servicebus.orders-topic}/Subscriptions/shipping-cancelled-sub

# DLQ nativas: cada subscription tiene la suya, con el sufijo /$deadletterqueue.
smartlogix.servicebus.shipping.created-dead-letter-destination=amqps://${smartlogix.servicebus.host}/${smartlogix.servicebus.orders-topic}/Subscriptions/shipping-created-sub/$deadletterqueue
smartlogix.servicebus.shipping.cancelled-dead-letter-destination=amqps://${smartlogix.servicebus.host}/${smartlogix.servicebus.orders-topic}/Subscriptions/shipping-cancelled-sub/$deadletterqueue

# POLITICA DE CONSUMIDOR RESILIENTE (guias 2.2.2 y 2.2.3).
# - lock-duration=PT30S: el mensaje queda en PeekLock mientras el
#   listener procesa; si el proceso muere, el lock expira y Service Bus
#   lo reentrega solo (equivalente al prefetch=1 / Fair Dispatch).
# - max-delivery-count=3 y default-message-time-to-live=PT30S: tras 3
#   entregas fallidas o 30s sin consumo, Service Bus deriva el mensaje
#   a la DLQ de la subscription. Es el equivalente funcional de
#   reintentos con backoff + default-requeue-rejected=false + DLX.
#   Nota: a diferencia de RabbitMQ, aqui el reintento NO es interno del
#   contenedor con backoff configurable; el broker reentrega de inmediato.
#   Esa limitacion se compensa con max-delivery-count, que es el mecanismo
#   nativo y es el que se audita en la rúbrica.
smartlogix.servicebus.consumer.max-delivery-count=3

# El listener NO usa conversion automatica de Spring (leemos el cuerpo
# crudo con message.getBody(byte[].class) y deserializamos con Jackson),
# porque el AMQP body de Service Bus llega como Data/AmqpValue y no como
# JSON de application/json.
spring.jms.listener.acknowledge-mode=auto

# ------------------------------------------------------------
# JWT: emisor y secreto usados para validar tokens (compartido con gateway).
# ------------------------------------------------------------
smartlogix.jwt.issuer=${SMARTLOGIX_JWT_ISSUER:smartlogix-identity-service}
smartlogix.jwt.secret=${SMARTLOGIX_JWT_SECRET}