name: CI/CD SmartLogix

on:
  push:
    branches: [deploy, azure-deploy]
  workflow_dispatch:

env:
  ACR_NAME: smartlogix2026acr
  ACR_LOGIN_SERVER: smartlogix2026acr.azurecr.io
  VM_HOST: ${{ secrets.VM_HOST }}
  VM_USER: ${{ secrets.VM_USER }}
  VM_SSH_KEY: ${{ secrets.VM_SSH_KEY }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Login to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Login to ACR
        run: az acr login --name ${{ env.ACR_NAME }}

      - name: Build and push Java services
        run: |
          for svc in api-gateway identity-service order-service inventory-service shipping-service sb-admin-service; do
            echo "=== Building $svc ==="
            cd $svc
            mvn -B -ntp package -DskipTests
            docker build -t ${{ env.ACR_LOGIN_SERVER }}/smartlogix/$svc:azure .
            docker push ${{ env.ACR_LOGIN_SERVER }}/smartlogix/$svc:azure
            cd ..
          done

      - name: Build and push frontend
        run: |
          cd frontend
          docker build -t ${{ env.ACR_LOGIN_SERVER }}/smartlogix/frontend:azure .
          docker push ${{ env.ACR_LOGIN_SERVER }}/smartlogix/frontend:azure
          cd ..

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Login to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Login to ACR
        run: az acr login --name ${{ env.ACR_NAME }}

      - name: Upload compose to VM
        uses: appleboy/scp-action@v1
        with:
          host: ${{ env.VM_HOST }}
          username: ${{ env.VM_USER }}
          key: ${{ env.VM_SSH_KEY }}
          source: "docker-compose.yml"
          target: "/tmp/smartlogix"

      - name: Deploy to VM
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ env.VM_HOST }}
          username: ${{ env.VM_USER }}
          key: ${{ env.VM_SSH_KEY }}
          script: |
            sudo cp /tmp/smartlogix/docker-compose.yml /opt/smartlogix/
            cd /opt/smartlogix
            docker compose pull
            docker compose up -d
            docker system prune -f