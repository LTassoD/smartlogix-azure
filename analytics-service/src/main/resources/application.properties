# ============================================================
# SmartLogix analytics-service (EP3) - CONSUMIDOR de Kafka
# ============================================================

spring.application.name=analytics-service
server.port=8085

# ------------------------------------------------------------
# KAFKA: consume el topic de pedidos con su PROPIO consumer group.
# Con "latest" el dashboard muestra lo que llega en vivo y no mezcla
# el historico del topic con la ventana de 60 s.
# ------------------------------------------------------------
spring.kafka.bootstrap-servers=${SMARTLOGIX_KAFKA_BOOTSTRAP:localhost:9092}
spring.kafka.consumer.group-id=${SMARTLOGIX_ANALYTICS_GROUP:smartlogix-analytics}
spring.kafka.consumer.auto-offset-reset=latest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer

smartlogix.kafka.orders-topic=${SMARTLOGIX_KAFKA_TOPIC:smartlogix.orders.events}

# ------------------------------------------------------------
# ANALITICA: ventana deslizante y frecuencia del stream SSE.
# ------------------------------------------------------------
smartlogix.analytics.window-seconds=${SMARTLOGIX_ANALYTICS_WINDOW_SECONDS:60}
smartlogix.analytics.stream-interval-ms=${SMARTLOGIX_ANALYTICS_STREAM_MS:1000}

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
