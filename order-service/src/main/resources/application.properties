# ============================================================
# SmartLogix order-service (pedidos) — PRODUCTOR de eventos RabbitMQ
# ============================================================

# Nombre y puerto de este microservicio.
spring.application.name=order-service
server.port=8082

# DevTools: sin reinicio automático / live reload.
spring.devtools.restart.enabled=false
spring.devtools.livereload.enabled=false

# ------------------------------------------------------------
# BASE DE DATOS: Postgres 5434 → BD smartlogix_orders_db.
# ------------------------------------------------------------
spring.datasource.url=jdbc:postgresql://localhost:5434/smartlogix_orders_db
spring.datasource.username=${SMARTLOGIX_DB_USERNAME:smartlogix}
spring.datasource.password=${SMARTLOGIX_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.connection-timeout=5000
spring.datasource.hikari.validation-timeout=3000
spring.datasource.hikari.maximum-pool-size=5

# JPA/Hibernate (crea/actualiza tablas; show-sql desactivado por rendimiento).
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false
logging.level.org.hibernate.SQL=INFO
logging.level.org.hibernate.orm.jdbc.bind=INFO
logging.level.org.springframework.boot.devtools=OFF

# Actuator: health e info.
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# ------------------------------------------------------------
# RABBITMQ — CONEXIÓN Y PUBLICACIÓN DE EVENTOS.
# Este servicio es el PRODUCTOR: publica OrderCreatedEvent cuando un
# pedido pasa a CONFIRMED. Conecta a localhost:5672 con las credenciales
# del entorno. Los timeouts/heartbeat mantienen estable la conexión.
# ------------------------------------------------------------
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=${SMARTLOGIX_RABBITMQ_USERNAME:smartlogix}
spring.rabbitmq.password=${SMARTLOGIX_RABBITMQ_PASSWORD}
spring.rabbitmq.connection-timeout=5s
spring.rabbitmq.template.reply-timeout=5s
spring.rabbitmq.requested-heartbeat=30s

# PUBLISHER CONFIRMS (guía 2.2.1): el broker confirma al PRODUCTOR que recibió
# el mensaje (ack) o lo rechazó (nack). Modo "correlated" = cada mensaje lleva un
# CorrelationData que identifica la confirmación (lo usamos con el orderNumber).
spring.rabbitmq.publisher-confirm-type=correlated

# ------------------------------------------------------------
# JWT: emisor y secreto usados para validar tokens (compartido con gateway).
# ------------------------------------------------------------
smartlogix.jwt.issuer=${SMARTLOGIX_JWT_ISSUER:smartlogix-identity-service}
smartlogix.jwt.secret=${SMARTLOGIX_JWT_SECRET}