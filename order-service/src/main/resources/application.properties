# ============================================================
# SmartLogix order-service (pedidos) — PRODUCTOR de eventos RabbitMQ
# ============================================================

# Nombre y puerto de este microservicio.
spring.application.name=order-service
server.port=8082

# DevTools: sin reinicio automático / live reload.
spring.devtools.restart.enabled=false
spring.devtools.livereload.enabled=false

# ------------------------------------------------------------
# BASE DE DATOS: Postgres 5434 → BD smartlogix_orders_db.
# ------------------------------------------------------------
spring.datasource.url=jdbc:postgresql://localhost:5434/smartlogix_orders_db
spring.datasource.username=${SMARTLOGIX_DB_USERNAME:smartlogix}
spring.datasource.password=${SMARTLOGIX_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.connection-timeout=5000
spring.datasource.hikari.validation-timeout=3000
spring.datasource.hikari.maximum-pool-size=5

# JPA/Hibernate (crea/actualiza tablas; show-sql desactivado por rendimiento).
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false
logging.level.org.hibernate.SQL=INFO
logging.level.org.hibernate.orm.jdbc.bind=INFO
logging.level.org.springframework.boot.devtools=OFF

# Actuator: health e info.
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# ------------------------------------------------------------
# AZURE SERVICE BUS (AMQP 1.0) - PUBLICACION DE EVENTOS.
# order-service publica order.created / order.cancelled en el topic
# smartlogix.orders.topic. El tipo de evento viaja en la PROPIEDAD
# eventType (no en una routing key: Service Bus enruta por SqlFilter).
# ------------------------------------------------------------
smartlogix.servicebus.host=${SMARTLOGIX_SERVICEBUS_HOST:sb-smartlogix-ns.servicebus.windows.net}
smartlogix.servicebus.policy-name=${SMARTLOGIX_SERVICEBUS_POLICY:smartlogix-app}
smartlogix.servicebus.policy-key=${SMARTLOGIX_SERVICEBUS_KEY}
smartlogix.servicebus.orders-topic=smartlogix.orders.topic

# REQUEST/REPLY SINCRONO de verificacion de stock (rubrica: mensajes sincronos).
# Inventario escucha .req y responde en .reply. Las colas se crearon con
# enableSession=false porque Qpid JMS no admite receptores sessionful; la
# correlacion se hace con la property stockCheckId.
smartlogix.servicebus.stock-check.request-destination=amqps://${smartlogix.servicebus.host}/smartlogix.stock-check.req
smartlogix.servicebus.stock-check.reply-destination=amqps://${smartlogix.servicebus.host}/smartlogix.stock-check.reply
smartlogix.servicebus.stock-check.timeout-ms=${SMARTLOGIX_STOCK_CHECK_TIMEOUT_MS:10000}

# ------------------------------------------------------------
# APACHE KAFKA (EP3) - DUAL PUBLISH PARA ANALITICA EN TIEMPO REAL.
# El MISMO evento que va a Service Bus se publica ademas en el topic
# de pedidos, donde un consumidor calcula metricas en vivo
# (pedidos/min, ingreso, top productos, lag).
# Kafka es OPCIONAL: si no responde, el pedido NO se ve afectado.
# ------------------------------------------------------------
smartlogix.kafka.enabled=${SMARTLOGIX_KAFKA_ENABLED:true}
smartlogix.kafka.orders-topic=${SMARTLOGIX_KAFKA_TOPIC:smartlogix.orders.events}
spring.kafka.bootstrap-servers=${SMARTLOGIX_KAFKA_BOOTSTRAP:localhost:9092}
spring.kafka.client-id=smartlogix-order-service
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
# acks=all + idempotencia: el broker confirma y no se duplican en reintentos
spring.kafka.producer.acks=all
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.producer.properties.linger.ms=5

# ------------------------------------------------------------
# JWT: emisor y secreto usados para validar tokens (compartido con gateway).
# ------------------------------------------------------------
smartlogix.jwt.issuer=${SMARTLOGIX_JWT_ISSUER:smartlogix-identity-service}
smartlogix.jwt.secret=${SMARTLOGIX_JWT_SECRET}