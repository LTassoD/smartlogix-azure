# ============================================================
# SmartLogix inventory-service (stock) — CONSUMIDOR de eventos RabbitMQ
# ============================================================

# Nombre y puerto de este microservicio.
spring.application.name=inventory-service
server.port=8081

# DevTools: sin reinicio automático / live reload.
spring.devtools.restart.enabled=false
spring.devtools.livereload.enabled=false

# ------------------------------------------------------------
# BASE DE DATOS: Postgres 5433 → BD smartlogix_inventory_db.
# ------------------------------------------------------------
spring.datasource.url=jdbc:postgresql://localhost:5433/smartlogix_inventory_db
spring.datasource.username=${SMARTLOGIX_DB_USERNAME:smartlogix}
spring.datasource.password=${SMARTLOGIX_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.connection-timeout=5000
spring.datasource.hikari.validation-timeout=3000
spring.datasource.hikari.maximum-pool-size=5

# JPA/Hibernate (crea/actualiza tablas; show-sql desactivado por rendimiento).
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false
logging.level.org.hibernate.SQL=INFO
logging.level.org.hibernate.orm.jdbc.bind=INFO
logging.level.org.springframework.boot.devtools=OFF

# Actuator: health e info.
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# ------------------------------------------------------------
# RABBITMQ — CONEXIÓN Y ESCUCHA DE EVENTOS.
# Este servicio es un CONSUMIDOR vía @RabbitListener en su cola
# "smartlogix.inventory.order-created.queue". Al recibir un
# OrderCreatedEvent descuenta stock (move ORDER_OUT).
# ------------------------------------------------------------
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=${SMARTLOGIX_RABBITMQ_USERNAME:smartlogix}
spring.rabbitmq.password=${SMARTLOGIX_RABBITMQ_PASSWORD}
spring.rabbitmq.connection-timeout=5s
spring.rabbitmq.template.reply-timeout=5s
spring.rabbitmq.requested-heartbeat=30s

# POLÍTICA DE CONSUMIDOR RESILIENTE (guías 2.2.2 y 2.2.3).
# prefetch=1 (Fair Dispatch), reintentos con backoff exponencial (1s→2s→4s, 3
# intentos) y rechazo sin requeue al agotarlos → mensaje al DLX → DLQ (auditoría).
spring.rabbitmq.listener.simple.prefetch=1
spring.rabbitmq.listener.simple.default-requeue-rejected=false
spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.initial-interval=1000
spring.rabbitmq.listener.simple.retry.max-interval=10000
spring.rabbitmq.listener.simple.retry.multiplier=2.0
spring.rabbitmq.listener.simple.retry.max-attempts=3

# ------------------------------------------------------------
# JWT: emisor y secreto usados para validar tokens (compartido con gateway).
# ------------------------------------------------------------
smartlogix.jwt.issuer=${SMARTLOGIX_JWT_ISSUER:smartlogix-identity-service}
smartlogix.jwt.secret=${SMARTLOGIX_JWT_SECRET}