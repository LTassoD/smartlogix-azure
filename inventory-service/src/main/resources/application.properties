spring.application.name=inventory-service
server.port=8081

# DevTools is kept as a dependency for development, but automatic restarts/file watching
# are disabled to avoid request hangs caused by console logging during local demos.
spring.devtools.restart.enabled=false
spring.devtools.livereload.enabled=false

spring.datasource.url=jdbc:postgresql://localhost:5433/smartlogix_inventory_db
spring.datasource.username=${SMARTLOGIX_DB_USERNAME:smartlogix}
spring.datasource.password=${SMARTLOGIX_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.connection-timeout=5000
spring.datasource.hikari.validation-timeout=3000
spring.datasource.hikari.maximum-pool-size=5

spring.jpa.hibernate.ddl-auto=update
# Avoid per-request SQL printing in the console. In local testing this can block
# request threads when many calls are sent from Postman.
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false
logging.level.org.hibernate.SQL=INFO
logging.level.org.hibernate.orm.jdbc.bind=INFO
logging.level.org.springframework.boot.devtools=OFF

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=${SMARTLOGIX_RABBITMQ_USERNAME:smartlogix}
spring.rabbitmq.password=${SMARTLOGIX_RABBITMQ_PASSWORD}
spring.rabbitmq.connection-timeout=5s
spring.rabbitmq.template.reply-timeout=5s
spring.rabbitmq.requested-heartbeat=30s

# JWT verification settings shared with identity-service.
smartlogix.jwt.issuer=${SMARTLOGIX_JWT_ISSUER:smartlogix-identity-service}
smartlogix.jwt.secret=${SMARTLOGIX_JWT_SECRET}
