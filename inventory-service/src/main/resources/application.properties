# ============================================================
# SmartLogix inventory-service (stock) — CONSUMIDOR de eventos RabbitMQ
# ============================================================

# Nombre y puerto de este microservicio.
spring.application.name=inventory-service
server.port=8081

# DevTools: sin reinicio automático / live reload.
spring.devtools.restart.enabled=false
spring.devtools.livereload.enabled=false

# ------------------------------------------------------------
# BASE DE DATOS: Postgres 5433 → BD smartlogix_inventory_db.
# ------------------------------------------------------------
spring.datasource.url=jdbc:postgresql://localhost:5433/smartlogix_inventory_db
spring.datasource.username=${SMARTLOGIX_DB_USERNAME:smartlogix}
spring.datasource.password=${SMARTLOGIX_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.connection-timeout=5000
spring.datasource.hikari.validation-timeout=3000
spring.datasource.hikari.maximum-pool-size=5

# JPA/Hibernate (crea/actualiza tablas; show-sql desactivado por rendimiento).
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false
logging.level.org.hibernate.SQL=INFO
logging.level.org.hibernate.orm.jdbc.bind=INFO
logging.level.org.springframework.boot.devtools=OFF

# Actuator: health e info.
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# ------------------------------------------------------------
# AZURE SERVICE BUS — TOPOLOGÍA DE EVENTOS (AMQP 1.0).
# Este servicio es un CONSUMIDOR vía @JmsListener sobre su
# subscription "inventory-sub" del topic smartlogix.orders.topic.
# Al recibir un OrderCreatedEvent descuenta stock (ORDER_OUT).
#
# Equivalencia con el diseño RabbitMQ anterior:
#   DirectExchange  -> Topic
#   binding + rk    -> SqlFilter (eventType = 'order.created')
#   cola propia     -> Subscription propia
#   DLX + DLQ       -> DLQ nativa (/$deadletterqueue)
#   x-message-ttl   -> default-message-time-to-live de la subscription
#   reintentos      -> max-delivery-count con reentrega PeekLock
# ------------------------------------------------------------
smartlogix.servicebus.host=${SMARTLOGIX_SERVICEBUS_HOST:sb-smartlogix-ns.servicebus.windows.net}
smartlogix.servicebus.policy-name=${SMARTLOGIX_SERVICEBUS_POLICY:smartlogix-app}
smartlogix.servicebus.policy-key=${SMARTLOGIX_SERVICEBUS_KEY}

# Direcciones AMQP: Service Bus exige el esquema amqps:// y las subscriptions
# van en /Subscriptions/<nombre>, no como sufijo "/<nombre>".
smartlogix.servicebus.inventory.subscription-destination=amqps://${smartlogix.servicebus.host}/smartlogix.orders.topic/Subscriptions/inventory-sub
smartlogix.servicebus.inventory.dead-letter-destination=amqps://${smartlogix.servicebus.host}/smartlogix.orders.topic/Subscriptions/inventory-sub/$deadletterqueue

# Contenedor de listeners JMS.
# sessionTransacted=false: no hay transacciones JMS entre entidades en Service Bus;
# PeekLock con reentrega automatica cubre el mismo guarantee.
spring.jms.listener.acknowledge-mode=auto
spring.jms.listener.concurrency=1
spring.jms.listener.max-concurrency=3

# ------------------------------------------------------------
# JWT: emisor y secreto usados para validar tokens (compartido con gateway).
# ------------------------------------------------------------
smartlogix.jwt.issuer=${SMARTLOGIX_JWT_ISSUER:smartlogix-identity-service}
smartlogix.jwt.secret=${SMARTLOGIX_JWT_SECRET}

# REQUEST/REPLY SINCRONO de verificacion de stock: este servicio ESCUCHA .req
# y responde en .reply. Las colas tienen enableSession=false (Qpid JMS no admite
# receptores sessionful) y la correlacion va por la property stockCheckId.
smartlogix.servicebus.stock-check.request-destination=${smartlogix.servicebus.host}/smartlogix.stock-check.req
smartlogix.servicebus.stock-check.reply-destination=${smartlogix.servicebus.host}/smartlogix.stock-check.reply
