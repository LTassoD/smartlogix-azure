# ---------------------------------------------------------------------------
# Apache Kafka en modo KRaft (sin Zookeeper) - EP3 SmartLogix
#
# Local (solo Kafka):   docker compose -f kafka/docker-compose.kafka.yml up -d
# En la VM (con stack): docker compose -f docker-compose.yml \
#                                     -f kafka/docker-compose.kafka.yml up -d
#
# Listeners:
#   - PLAINTEXT      :29092  -> para contenedores de la misma red (kafka:29092)
#   - PLAINTEXT_HOST :9092   -> para scripts en el host (localhost:9092)
#   - CONTROLLER     :9093   -> quorum KRaft (interno)
# ---------------------------------------------------------------------------
services:
  kafka:
    image: apache/kafka:3.9.1
    container_name: smartlogix-kafka
    restart: unless-stopped
    ports:
      # Solo accesible desde la propia maquina (los scripts del host usan localhost:9092).
      - "127.0.0.1:9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:29092,PLAINTEXT_HOST://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      # Un solo broker: factores de replicación en 1 (obligatorio)
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # Defaults del broker
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_DEFAULT_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_RETENTION_HOURS: 168
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s
    volumes:
      - kafka-data:/var/lib/kafka/data
    networks:
      # Misma red que el stack: asi order-service (y analytics-service) resuelven
      # "kafka:29092" cuando se levanta con -f docker-compose.yml -f kafka/...
      - smartlogix-net

volumes:
  kafka-data:

networks:
  smartlogix-net:
    driver: bridge
