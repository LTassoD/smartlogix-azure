# ============================================================
# SmartLogix API Gateway / BFF
# ============================================================

# Nombre de la aplicación (se usa en logs y Actuator).
spring.application.name=api-gateway

# Puerto de escucha del gateway.
# Configurable por entorno: en local se usaba 8085 porque el 8080 lo ocupa
# el listener de Oracle XE en esa máquina. En Azure corre en un contenedor
# aislado, así que usa 8080 por defecto.
server.port=${SERVER_PORT:8080}

# DevTools queda como dependencia de desarrollo, pero se desactivan
# los reinicios automáticos / live reload para evitar que el log ruidoso
# congel e las peticiones durante demos locales.
spring.devtools.restart.enabled=false
spring.devtools.livereload.enabled=false

# ------------------------------------------------------------
# RUTAS DEL GATEWAY (Spring Cloud Gateway)
# El frontend SOLO habla con el gateway (localhost:8085);
# el gateway reenvía (proxy) cada request al microservicio correcto.
# Formato: spring.cloud.gateway.server.webmvc.routes[N].{id,uri,predicates}
#   uri        → a dónde reenviar (se lee de una env var, con fallback local)
#   predicates → qué Path hace match con esta ruta
# ------------------------------------------------------------

# Ruta 0: AUTHENTICATION → identity-service (login, 2FA, refresh, etc.)
spring.cloud.gateway.server.webmvc.routes[0].id=identity-service
spring.cloud.gateway.server.webmvc.routes[0].uri=${SMARTLOGIX_IDENTITY_SERVICE_URL:http://localhost:8084}
spring.cloud.gateway.server.webmvc.routes[0].predicates[0]=Path=/api/auth/**

# Ruta 1: USUARIOS → identity-service (admin gestiona usuarios)
spring.cloud.gateway.server.webmvc.routes[1].id=identity-users-service
spring.cloud.gateway.server.webmvc.routes[1].uri=${SMARTLOGIX_IDENTITY_SERVICE_URL:http://localhost:8084}
spring.cloud.gateway.server.webmvc.routes[1].predicates[0]=Path=/api/users,/api/users/**

# Ruta 2: INVENTARIO → inventory-service
spring.cloud.gateway.server.webmvc.routes[2].id=inventory-service
spring.cloud.gateway.server.webmvc.routes[2].uri=${SMARTLOGIX_INVENTORY_SERVICE_URL:http://localhost:8081}
spring.cloud.gateway.server.webmvc.routes[2].predicates[0]=Path=/api/inventory/**

# Ruta 3: PEDIDOS → order-service
spring.cloud.gateway.server.webmvc.routes[3].id=order-service
spring.cloud.gateway.server.webmvc.routes[3].uri=${SMARTLOGIX_ORDERS_SERVICE_URL:http://localhost:8082}
spring.cloud.gateway.server.webmvc.routes[3].predicates[0]=Path=/api/orders/**

# Ruta 4: DESPACHOS → shipping-service
spring.cloud.gateway.server.webmvc.routes[4].id=shipping-service
spring.cloud.gateway.server.webmvc.routes[4].uri=${SMARTLOGIX_SHIPPING_SERVICE_URL:http://localhost:8083}
spring.cloud.gateway.server.webmvc.routes[4].predicates[0]=Path=/api/shipping/**

# ------------------------------------------------------------
# URLs internas (usadas por el SystemHealthService y otras partes
# del gateway para verificar que cada microservicio esté vivo).
# ------------------------------------------------------------
smartlogix.services.identity.url=${SMARTLOGIX_IDENTITY_SERVICE_URL:http://localhost:8084}
smartlogix.services.inventory.url=${SMARTLOGIX_INVENTORY_SERVICE_URL:http://localhost:8081}
smartlogix.services.orders.url=${SMARTLOGIX_ORDERS_SERVICE_URL:http://localhost:8082}
smartlogix.services.shipping.url=${SMARTLOGIX_SHIPPING_SERVICE_URL:http://localhost:8083}

# ------------------------------------------------------------
# Actuator (monitoreo). Se exponen health/info/gateway.
# health con show-details para ver el estado detallado de c/u en la demo.
# ------------------------------------------------------------
management.endpoints.web.exposure.include=health,info,gateway
management.endpoint.health.show-details=always
management.info.env.enabled=true
management.endpoint.gateway.enabled=true

# Info mostrada por /actuator/info
info.app.name=api-gateway
info.app.description=SmartLogix Backend For Frontend and API Gateway

# ------------------------------------------------------------
# Logs (nivel INFO para gateway/web/security durante desarrollo).
# ------------------------------------------------------------
logging.level.org.springframework.cloud.gateway=INFO
logging.level.org.springframework.cloud.gateway.server.mvc=INFO
logging.level.reactor.netty.http.client=INFO
logging.level.org.springframework.web=INFO
logging.level.org.springframework.security=INFO
logging.level.org.springframework.boot.devtools=OFF
# Solo activar DEBUG de CorrelationIdFilter al rastrear una petición concreta:
# DEBUG por request puede saturar la consola.
logging.level.cl.duoc.smartlogix.gateway.filter.CorrelationIdFilter=INFO

# ------------------------------------------------------------
# CORS: configurado en config/CorsConfig.java
# Los orígenes permitidos se inyectan por variable de entorno.
#   local → http://localhost:3000,http://localhost:5173 (valor por defecto)
#   azure → FQDN real del frontend (SMARTLOGIX_CORS_ALLOWED_ORIGINS)
# En Azure el frontend usa proxy same-origin vía nginx, por lo que
# normalmente el navegador ni siquiera dispara CORS.
# ------------------------------------------------------------
smartlogix.cors.allowed-origins=${SMARTLOGIX_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

# ------------------------------------------------------------
# Verificación JWT (misma llave y emisor que identity-service)
# ------------------------------------------------------------
smartlogix.jwt.issuer=${SMARTLOGIX_JWT_ISSUER:smartlogix-identity-service}
smartlogix.jwt.secret=${SMARTLOGIX_JWT_SECRET}