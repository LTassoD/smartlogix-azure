# ============================================================
# SmartLogix identity-service (autenticación, usuarios, JWT, 2FA)
# ============================================================

# Nombre y puerto de este microservicio.
spring.application.name=identity-service
server.port=8084

# DevTools: sin reinicio automático / live reload (evita congelar requests).
spring.devtools.restart.enabled=false
spring.devtools.livereload.enabled=false

# ------------------------------------------------------------
# BASE DE DATOS: Postgres del identity-service.
# URL por env var con fallback (5436 → BD smartlogix_identity_db).
# La contraseña SIEMPRE viene del entorno (SMARTLOGIX_DB_PASSWORD).
# ------------------------------------------------------------
spring.datasource.url=${SMARTLOGIX_IDENTITY_DB_URL:jdbc:postgresql://localhost:5436/smartlogix_identity_db}
spring.datasource.username=${SMARTLOGIX_DB_USERNAME:smartlogix}
spring.datasource.password=${SMARTLOGIX_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.connection-timeout=5000
spring.datasource.hikari.validation-timeout=3000
spring.datasource.hikari.maximum-pool-size=5

# ------------------------------------------------------------
# JPA/Hibernate.
# ddl-auto=update: crea/actualiza las tablas a partir de las entidades
# (adecuado para demo académica).
# ------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=update
# show-sql desactivado: en testing local puede bloquear los hilos de request
# cuando se envían muchas llamadas (Ej. Postman).
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false
logging.level.org.hibernate.SQL=INFO
logging.level.org.hibernate.orm.jdbc.bind=INFO
logging.level.org.springframework.boot.devtools=OFF

# Actuator: se exponen health e info (monitoreo).
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# ------------------------------------------------------------
# JWT - FRIMA Y VALIDACIÓN.
# El emisor, la expiración y el secreto vienen del entorno.
# El gateway usa la MISMA llave para verificar los tokens que genera identity.
# ------------------------------------------------------------
smartlogix.jwt.issuer=${SMARTLOGIX_JWT_ISSUER}
smartlogix.jwt.expiration-seconds=${SMARTLOGIX_JWT_EXPIRATION_SECONDS:3600}
smartlogix.jwt.secret=${SMARTLOGIX_JWT_SECRET}

# ------------------------------------------------------------
# 2FA TOTP - CIFRADO EN REPOSO.
# Los secrets TOTP se cifran al guardarlos. Ambos valores deben venir
# del entorno (NO se versionan). El salt es hexadecimal y debe tener
# al menos 16 caracteres hex (8 bytes).
# ------------------------------------------------------------
smartlogix.two-factor.encryption-password=${SMARTLOGIX_2FA_ENCRYPTION_PASSWORD}
smartlogix.two-factor.encryption-salt=${SMARTLOGIX_2FA_ENCRYPTION_SALT}
# Emisor mostrado en la app de autenticación (Google Authenticator, etc.)
smartlogix.two-factor.issuer=SmartLogix
# Tiempo (s) en que la configuración del 2FA sigue válida antes de expirar.
smartlogix.two-factor.setup-expiration-seconds=600
# Tiempo (s) de validez del desafío 2FA durante el login.
smartlogix.two-factor.challenge-expiration-seconds=300
# Intentos máximos para resolver el desafío 2FA antes de invalidarlo.
smartlogix.two-factor.challenge-max-attempts=5
# Ventana (s) de intentos de login permitidos antes de bloquear temporalmente.
smartlogix.two-factor.login-window-seconds=300
# Fallos máximos de login dentro de la ventana antes de bloquear.
smartlogix.two-factor.login-max-failures=5
# Duración del bloqueo por demasiados fallos de login.
smartlogix.two-factor.login-block-seconds=60
# Límite de entradas del rate-limiter en memoria (evita crecimiento ilimitado).
smartlogix.two-factor.rate-limit-max-entries=10000

# ------------------------------------------------------------
# DATOS SEMILLA (solo demo, opt-in).
# Si seed.enabled=true, se crean los 3 usuarios de ejemplo.
# Las contraseñas se pasan por variables de entorno y deben cumplir
# la política (≥8 chars, mayúscula, minúscula y número).
# ------------------------------------------------------------
smartlogix.seed.enabled=${SMARTLOGIX_SEED_ENABLED:false}
smartlogix.seed.admin-email=${SMARTLOGIX_SEED_ADMIN_EMAIL:admin@smartlogix.cl}
smartlogix.seed.admin-password=${SMARTLOGIX_SEED_ADMIN_PASSWORD:}
smartlogix.seed.admin-full-name=${SMARTLOGIX_SEED_ADMIN_FULL_NAME:Administrador SmartLogix}
smartlogix.seed.operator-email=${SMARTLOGIX_SEED_OPERATOR_EMAIL:operator@smartlogix.cl}
smartlogix.seed.operator-password=${SMARTLOGIX_SEED_OPERATOR_PASSWORD:}
smartlogix.seed.operator-full-name=${SMARTLOGIX_SEED_OPERATOR_FULL_NAME:Operador SmartLogix}
smartlogix.seed.viewer-email=${SMARTLOGIX_SEED_VIEWER_EMAIL:viewer@smartlogix.cl}
smartlogix.seed.viewer-password=${SMARTLOGIX_SEED_VIEWER_PASSWORD:}
smartlogix.seed.viewer-full-name=${SMARTLOGIX_SEED_VIEWER_FULL_NAME:Visualizador SmartLogix}