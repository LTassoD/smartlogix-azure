spring.application.name=identity-service
server.port=8084

# DevTools is kept as a dependency for development, but automatic restarts/file watching
# are disabled to avoid request hangs caused by console logging during local demos.
spring.devtools.restart.enabled=false
spring.devtools.livereload.enabled=false

spring.datasource.url=${SMARTLOGIX_IDENTITY_DB_URL:jdbc:postgresql://localhost:5436/smartlogix_identity_db}
spring.datasource.username=${SMARTLOGIX_DB_USERNAME:smartlogix}
spring.datasource.password=${SMARTLOGIX_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.connection-timeout=5000
spring.datasource.hikari.validation-timeout=3000
spring.datasource.hikari.maximum-pool-size=5

spring.jpa.hibernate.ddl-auto=update
# Avoid per-request SQL printing in the console. In local testing this can block
# request threads when many calls are sent from Postman.
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false
logging.level.org.hibernate.SQL=INFO
logging.level.org.hibernate.orm.jdbc.bind=INFO
logging.level.org.springframework.boot.devtools=OFF

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# JWT signing material and issuer are supplied by the deployment environment.
smartlogix.jwt.issuer=${SMARTLOGIX_JWT_ISSUER}
smartlogix.jwt.expiration-seconds=${SMARTLOGIX_JWT_EXPIRATION_SECONDS:3600}
smartlogix.jwt.secret=${SMARTLOGIX_JWT_SECRET}

# TOTP secrets are encrypted at rest. Both values must be supplied outside Git.
# The salt is hex-encoded and must contain at least 8 bytes (16 hex characters).
smartlogix.two-factor.encryption-password=${SMARTLOGIX_2FA_ENCRYPTION_PASSWORD}
smartlogix.two-factor.encryption-salt=${SMARTLOGIX_2FA_ENCRYPTION_SALT}
smartlogix.two-factor.issuer=SmartLogix
smartlogix.two-factor.setup-expiration-seconds=600
smartlogix.two-factor.challenge-expiration-seconds=300
smartlogix.two-factor.challenge-max-attempts=5
smartlogix.two-factor.login-window-seconds=300
smartlogix.two-factor.login-max-failures=5
smartlogix.two-factor.login-block-seconds=60
smartlogix.two-factor.rate-limit-max-entries=10000

# Demo data is opt-in and has no built-in account credentials.
smartlogix.seed.enabled=${SMARTLOGIX_SEED_ENABLED:false}
smartlogix.seed.admin-email=${SMARTLOGIX_SEED_ADMIN_EMAIL:admin@smartlogix.cl}
smartlogix.seed.admin-password=${SMARTLOGIX_SEED_ADMIN_PASSWORD:}
smartlogix.seed.admin-full-name=${SMARTLOGIX_SEED_ADMIN_FULL_NAME:Administrador SmartLogix}
smartlogix.seed.operator-email=${SMARTLOGIX_SEED_OPERATOR_EMAIL:operator@smartlogix.cl}
smartlogix.seed.operator-password=${SMARTLOGIX_SEED_OPERATOR_PASSWORD:}
smartlogix.seed.operator-full-name=${SMARTLOGIX_SEED_OPERATOR_FULL_NAME:Operador SmartLogix}
smartlogix.seed.viewer-email=${SMARTLOGIX_SEED_VIEWER_EMAIL:viewer@smartlogix.cl}
smartlogix.seed.viewer-password=${SMARTLOGIX_SEED_VIEWER_PASSWORD:}
smartlogix.seed.viewer-full-name=${SMARTLOGIX_SEED_VIEWER_FULL_NAME:Visualizador SmartLogix}
