spring.application.name=rabbit-admin-service
server.port=8086

# Conexion a RabbitMQ. En la nube apunta al clúster de 2 nodos
# (rabbitmq1/rabbitmq2) mediante las variables del entorno.
spring.rabbitmq.host=${SMARTLOGIX_RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${SMARTLOGIX_RABBITMQ_PORT:5672}
spring.rabbitmq.username=${SMARTLOGIX_RABBITMQ_USERNAME:smartlogix}
spring.rabbitmq.password=${SMARTLOGIX_RABBITMQ_PASSWORD}
# dynamic=true habilita el bean RabbitAdmin/AmqpAdmin con el que se declaran
# colas, exchanges y bindings en tiempo de ejecución desde la API REST.
spring.rabbitmq.dynamic=true

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
