services:
  frontend:
    image: smartlogix2026acr.azurecr.io/smartlogix/frontend:azure
    ports:
      - "80:80"
    environment:
      SMARTLOGIX_GATEWAY_URL: ${SMARTLOGIX_GATEWAY_URL:-http://localhost:8080}
    depends_on:
      - gateway
    networks:
      - smartlogix-net

  gateway:
    image: smartlogix2026acr.azurecr.io/smartlogix/api-gateway:azure
    ports:
      - "8080:8080"
    environment:
      JAVA_TOOL_OPTIONS: ${SMARTLOGIX_JVM_OPTS:--Xmx512m}
      SMARTLOGIX_IDENTITY_SERVICE_URL: http://identity:8084
      SMARTLOGIX_INVENTORY_SERVICE_URL: http://inventory:8081
      SMARTLOGIX_ORDERS_SERVICE_URL: http://order:8082
      SMARTLOGIX_SHIPPING_SERVICE_URL: http://shipping:8083
      SMARTLOGIX_JWT_SECRET: ${SMARTLOGIX_JWT_SECRET}
      SMARTLOGIX_JWT_ISSUER: ${SMARTLOGIX_JWT_ISSUER:-smartlogix-identity-service}
    depends_on:
      - identity
      - order
      - inventory
      - shipping
    networks:
      - smartlogix-net

  identity:
    image: smartlogix2026acr.azurecr.io/smartlogix/identity-service:azure
    ports:
      - "8084:8084"
    environment:
      JAVA_TOOL_OPTIONS: ${SMARTLOGIX_JVM_OPTS:--Xmx512m}
      SMARTLOGIX_IDENTITY_DB_URL: jdbc:postgresql://postgres-identity:5432/smartlogix_identity_db
      SMARTLOGIX_DB_USERNAME: ${SMARTLOGIX_DB_USERNAME:-smartlogix}
      SMARTLOGIX_DB_PASSWORD: ${SMARTLOGIX_DB_PASSWORD}
      SMARTLOGIX_JWT_SECRET: ${SMARTLOGIX_JWT_SECRET}
      SMARTLOGIX_JWT_ISSUER: ${SMARTLOGIX_JWT_ISSUER:-smartlogix-identity-service}
      SMARTLOGIX_2FA_ENCRYPTION_PASSWORD: ${SMARTLOGIX_2FA_ENCRYPTION_PASSWORD}
      SMARTLOGIX_2FA_ENCRYPTION_SALT: ${SMARTLOGIX_2FA_ENCRYPTION_SALT}
      SMARTLOGIX_SEED_ENABLED: ${SMARTLOGIX_SEED_ENABLED:-true}
      SMARTLOGIX_SEED_ADMIN_PASSWORD: ${SMARTLOGIX_SEED_ADMIN_PASSWORD:-Admin1234}
      SMARTLOGIX_SEED_OPERATOR_PASSWORD: ${SMARTLOGIX_SEED_OPERATOR_PASSWORD:-Operator123}
      SMARTLOGIX_SEED_VIEWER_PASSWORD: ${SMARTLOGIX_SEED_VIEWER_PASSWORD:-Viewer123}
    depends_on:
      postgres-identity:
        condition: service_healthy
    networks:
      - smartlogix-net

  order:
    image: smartlogix2026acr.azurecr.io/smartlogix/order-service:azure
    ports:
      - "8082:8082"
    environment:
      JAVA_TOOL_OPTIONS: ${SMARTLOGIX_JVM_OPTS:--Xmx512m}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-order:5432/smartlogix_order_db
      SMARTLOGIX_DB_USERNAME: ${SMARTLOGIX_DB_USERNAME:-smartlogix}
      SMARTLOGIX_DB_PASSWORD: ${SMARTLOGIX_DB_PASSWORD}
      SMARTLOGIX_JWT_SECRET: ${SMARTLOGIX_JWT_SECRET}
      SMARTLOGIX_JWT_ISSUER: ${SMARTLOGIX_JWT_ISSUER:-smartlogix-identity-service}
      SPRING_RABBITMQ_HOST: rabbitmq1
      SPRING_RABBITMQ_PORT: "5672"
      SMARTLOGIX_RABBITMQ_USERNAME: ${SMARTLOGIX_RABBITMQ_USERNAME:-smartlogix}
      SMARTLOGIX_RABBITMQ_PASSWORD: ${SMARTLOGIX_RABBITMQ_PASSWORD}
    depends_on:
      postgres-order:
        condition: service_healthy
      rabbitmq1:
        condition: service_healthy
    networks:
      - smartlogix-net

  inventory:
    image: smartlogix2026acr.azurecr.io/smartlogix/inventory-service:azure
    ports:
      - "8081:8081"
    environment:
      JAVA_TOOL_OPTIONS: ${SMARTLOGIX_JVM_OPTS:--Xmx512m}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-inventory:5432/smartlogix_inventory_db
      SMARTLOGIX_DB_USERNAME: ${SMARTLOGIX_DB_USERNAME:-smartlogix}
      SMARTLOGIX_DB_PASSWORD: ${SMARTLOGIX_DB_PASSWORD}
      SMARTLOGIX_JWT_SECRET: ${SMARTLOGIX_JWT_SECRET}
      SMARTLOGIX_JWT_ISSUER: ${SMARTLOGIX_JWT_ISSUER:-smartlogix-identity-service}
      SPRING_RABBITMQ_HOST: rabbitmq1
      SPRING_RABBITMQ_PORT: "5672"
      SMARTLOGIX_RABBITMQ_USERNAME: ${SMARTLOGIX_RABBITMQ_USERNAME:-smartlogix}
      SMARTLOGIX_RABBITMQ_PASSWORD: ${SMARTLOGIX_RABBITMQ_PASSWORD}
    depends_on:
      postgres-inventory:
        condition: service_healthy
      rabbitmq1:
        condition: service_healthy
    networks:
      - smartlogix-net

  shipping:
    image: smartlogix2026acr.azurecr.io/smartlogix/shipping-service:azure
    ports:
      - "8083:8083"
    environment:
      JAVA_TOOL_OPTIONS: ${SMARTLOGIX_JVM_OPTS:--Xmx512m}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-shipping:5432/smartlogix_shipping_db
      SMARTLOGIX_DB_USERNAME: ${SMARTLOGIX_DB_USERNAME:-smartlogix}
      SMARTLOGIX_DB_PASSWORD: ${SMARTLOGIX_DB_PASSWORD}
      SMARTLOGIX_JWT_SECRET: ${SMARTLOGIX_JWT_SECRET}
      SMARTLOGIX_JWT_ISSUER: ${SMARTLOGIX_JWT_ISSUER:-smartlogix-identity-service}
      SPRING_RABBITMQ_HOST: rabbitmq1
      SPRING_RABBITMQ_PORT: "5672"
      SMARTLOGIX_RABBITMQ_USERNAME: ${SMARTLOGIX_RABBITMQ_USERNAME:-smartlogix}
      SMARTLOGIX_RABBITMQ_PASSWORD: ${SMARTLOGIX_RABBITMQ_PASSWORD}
    depends_on:
      postgres-shipping:
        condition: service_healthy
      rabbitmq1:
        condition: service_healthy
    networks:
      - smartlogix-net

  rabbit-admin:
    image: smartlogix2026acr.azurecr.io/smartlogix/rabbit-admin-service:azure
    ports:
      - "8086:8086"
    environment:
      JAVA_TOOL_OPTIONS: ${SMARTLOGIX_JVM_OPTS:--Xmx512m}
      SPRING_RABBITMQ_HOST: rabbitmq1
      SPRING_RABBITMQ_PORT: "5672"
      SMARTLOGIX_RABBITMQ_USERNAME: ${SMARTLOGIX_RABBITMQ_USERNAME:-smartlogix}
      SMARTLOGIX_RABBITMQ_PASSWORD: ${SMARTLOGIX_RABBITMQ_PASSWORD}
    depends_on:
      rabbitmq1:
        condition: service_healthy
    networks:
      - smartlogix-net

  rabbitmq1:
    image: rabbitmq:3.13-management-alpine
    hostname: rabbitmq1
    environment:
      RABBITMQ_DEFAULT_USER: ${SMARTLOGIX_RABBITMQ_USERNAME:-smartlogix}
      RABBITMQ_DEFAULT_PASS: ${SMARTLOGIX_RABBITMQ_PASSWORD}
      RABBITMQ_ERLANG_COOKIE: ${SMARTLOGIX_RABBITMQ_COOKIE:-smartlogix-cluster-cookie}
      RABBITMQ_NODENAME: rabbit@rabbitmq1
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq1-data:/var/lib/rabbitmq
      - ./rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 12
    networks:
      - smartlogix-net

  rabbitmq2:
    image: rabbitmq:3.13-management-alpine
    hostname: rabbitmq2
    environment:
      RABBITMQ_DEFAULT_USER: ${SMARTLOGIX_RABBITMQ_USERNAME:-smartlogix}
      RABBITMQ_DEFAULT_PASS: ${SMARTLOGIX_RABBITMQ_PASSWORD}
      RABBITMQ_ERLANG_COOKIE: ${SMARTLOGIX_RABBITMQ_COOKIE:-smartlogix-cluster-cookie}
      RABBITMQ_NODENAME: rabbit@rabbitmq2
    volumes:
      - rabbitmq2-data:/var/lib/rabbitmq
      - ./rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
      - ./rabbitmq/join-cluster.sh:/usr/local/bin/join-cluster.sh:ro
    command: ["/bin/sh", "/usr/local/bin/join-cluster.sh"]
    depends_on:
      rabbitmq1:
        condition: service_healthy
    networks:
      - smartlogix-net

  postgres-identity:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: smartlogix_identity_db
      POSTGRES_USER: ${SMARTLOGIX_DB_USERNAME:-smartlogix}
      POSTGRES_PASSWORD: ${SMARTLOGIX_DB_PASSWORD}
    volumes:
      - postgres-identity-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${SMARTLOGIX_DB_USERNAME:-smartlogix} -d smartlogix_identity_db"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - smartlogix-net

  postgres-order:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: smartlogix_order_db
      POSTGRES_USER: ${SMARTLOGIX_DB_USERNAME:-smartlogix}
      POSTGRES_PASSWORD: ${SMARTLOGIX_DB_PASSWORD}
    volumes:
      - postgres-order-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${SMARTLOGIX_DB_USERNAME:-smartlogix} -d smartlogix_order_db"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - smartlogix-net

  postgres-inventory:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: smartlogix_inventory_db
      POSTGRES_USER: ${SMARTLOGIX_DB_USERNAME:-smartlogix}
      POSTGRES_PASSWORD: ${SMARTLOGIX_DB_PASSWORD}
    volumes:
      - postgres-inventory-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${SMARTLOGIX_DB_USERNAME:-smartlogix} -d smartlogix_inventory_db"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - smartlogix-net

  postgres-shipping:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: smartlogix_shipping_db
      POSTGRES_USER: ${SMARTLOGIX_DB_USERNAME:-smartlogix}
      POSTGRES_PASSWORD: ${SMARTLOGIX_DB_PASSWORD}
    volumes:
      - postgres-shipping-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${SMARTLOGIX_DB_USERNAME:-smartlogix} -d smartlogix_shipping_db"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - smartlogix-net

volumes:
  postgres-identity-data:
  postgres-order-data:
  postgres-inventory-data:
  postgres-shipping-data:
  rabbitmq1-data:
  rabbitmq2-data:

networks:
  smartlogix-net:
    driver: bridge
