services:
  frontend:
    image: smartlogix2026acr.azurecr.io/smartlogix/frontend:azure
    ports:
      - "80:80"
    environment:
      # nginx hace proxy hacia el gateway por la red de Compose (nombre del servicio, puerto interno).
      SMARTLOGIX_GATEWAY_URL: ${SMARTLOGIX_GATEWAY_URL:-http://gateway:8080}
    depends_on:
      - gateway
    networks:
      - smartlogix-net

  gateway:
    image: smartlogix2026acr.azurecr.io/smartlogix/api-gateway:azure
    ports:
      # Host configurable: 8080 en la VM; en la maquina de desarrollo se usa 8090 (Oracle ocupa el 8080).
      - "${SMARTLOGIX_GATEWAY_PORT:-8080}:8080"
    environment:
      JAVA_TOOL_OPTIONS: ${SMARTLOGIX_JVM_OPTS:--Xmx512m}
      SMARTLOGIX_IDENTITY_SERVICE_URL: http://identity:8084
      SMARTLOGIX_INVENTORY_SERVICE_URL: http://inventory:8081
      SMARTLOGIX_ORDERS_SERVICE_URL: http://order:8082
      SMARTLOGIX_SHIPPING_SERVICE_URL: http://shipping:8083
      SMARTLOGIX_ANALYTICS_SERVICE_URL: http://analytics:8085
      SMARTLOGIX_JWT_SECRET: ${SMARTLOGIX_JWT_SECRET}
      SMARTLOGIX_JWT_ISSUER: ${SMARTLOGIX_JWT_ISSUER:-smartlogix-identity-service}
    depends_on:
      - identity
      - order
      - inventory
      - shipping
      - analytics
    networks:
      - smartlogix-net

  identity:
    image: smartlogix2026acr.azurecr.io/smartlogix/identity-service:azure
    ports:
      - "8084:8084"
    environment:
      JAVA_TOOL_OPTIONS: ${SMARTLOGIX_JVM_OPTS:--Xmx512m}
      SMARTLOGIX_IDENTITY_DB_URL: jdbc:postgresql://postgres-identity:5432/smartlogix_identity_db
      SMARTLOGIX_DB_USERNAME: ${SMARTLOGIX_DB_USERNAME:-smartlogix}
      SMARTLOGIX_DB_PASSWORD: ${SMARTLOGIX_DB_PASSWORD}
      SMARTLOGIX_JWT_SECRET: ${SMARTLOGIX_JWT_SECRET}
      SMARTLOGIX_JWT_ISSUER: ${SMARTLOGIX_JWT_ISSUER:-smartlogix-identity-service}
      SMARTLOGIX_2FA_ENCRYPTION_PASSWORD: ${SMARTLOGIX_2FA_ENCRYPTION_PASSWORD}
      SMARTLOGIX_2FA_ENCRYPTION_SALT: ${SMARTLOGIX_2FA_ENCRYPTION_SALT}
      SMARTLOGIX_SEED_ENABLED: ${SMARTLOGIX_SEED_ENABLED:-true}
      SMARTLOGIX_SEED_ADMIN_PASSWORD: ${SMARTLOGIX_SEED_ADMIN_PASSWORD:-Admin1234}
      SMARTLOGIX_SEED_OPERATOR_PASSWORD: ${SMARTLOGIX_SEED_OPERATOR_PASSWORD:-Operator123}
      SMARTLOGIX_SEED_VIEWER_PASSWORD: ${SMARTLOGIX_SEED_VIEWER_PASSWORD:-Viewer123}
    depends_on:
      postgres-identity:
        condition: service_healthy
    networks:
      - smartlogix-net

  analytics:
    # EP3: consume pedidos desde Kafka y expone metricas REST + SSE (ver docs/EP3_STREAMING.md).
    image: smartlogix2026acr.azurecr.io/smartlogix/analytics-service:azure
    ports:
      # Host 8086: el 8085 lo usa sb-admin-service en este compose.
      - "8086:8085"
    environment:
      JAVA_TOOL_OPTIONS: ${SMARTLOGIX_JVM_OPTS:--Xmx256m}
      SMARTLOGIX_KAFKA_BOOTSTRAP: ${SMARTLOGIX_KAFKA_BOOTSTRAP:-kafka:29092}
      SMARTLOGIX_KAFKA_TOPIC: ${SMARTLOGIX_KAFKA_TOPIC:-smartlogix.orders.events}
    networks:
      - smartlogix-net

  order:
    image: smartlogix2026acr.azurecr.io/smartlogix/order-service:azure
    ports:
      - "8082:8082"
    environment:
      JAVA_TOOL_OPTIONS: ${SMARTLOGIX_JVM_OPTS:--Xmx512m}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-order:5432/smartlogix_order_db
      SMARTLOGIX_DB_USERNAME: ${SMARTLOGIX_DB_USERNAME:-smartlogix}
      SMARTLOGIX_DB_PASSWORD: ${SMARTLOGIX_DB_PASSWORD}
      SMARTLOGIX_JWT_SECRET: ${SMARTLOGIX_JWT_SECRET}
      SMARTLOGIX_JWT_ISSUER: ${SMARTLOGIX_JWT_ISSUER:-smartlogix-identity-service}
      SMARTLOGIX_SERVICEBUS_HOST: ${SMARTLOGIX_SERVICEBUS_HOST:-sb-smartlogix-ns.servicebus.windows.net}
      SMARTLOGIX_SERVICEBUS_POLICY: ${SMARTLOGIX_SERVICEBUS_POLICY:-smartlogix-app}
      SMARTLOGIX_SERVICEBUS_KEY: ${SMARTLOGIX_SERVICEBUS_KEY}
      # EP3: dual publish hacia Kafka (listener interno de la red Docker).
      # Si Kafka no esta arriba el pedido sigue su curso: solo se registra un warning.
      SMARTLOGIX_KAFKA_ENABLED: ${SMARTLOGIX_KAFKA_ENABLED:-true}
      SMARTLOGIX_KAFKA_BOOTSTRAP: ${SMARTLOGIX_KAFKA_BOOTSTRAP:-kafka:29092}
      SMARTLOGIX_KAFKA_TOPIC: ${SMARTLOGIX_KAFKA_TOPIC:-smartlogix.orders.events}
    depends_on:
      postgres-order:
        condition: service_healthy
    networks:
      - smartlogix-net

  inventory:
    image: smartlogix2026acr.azurecr.io/smartlogix/inventory-service:azure
    ports:
      - "8081:8081"
    environment:
      JAVA_TOOL_OPTIONS: ${SMARTLOGIX_JVM_OPTS:--Xmx512m}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-inventory:5432/smartlogix_inventory_db
      SMARTLOGIX_DB_USERNAME: ${SMARTLOGIX_DB_USERNAME:-smartlogix}
      SMARTLOGIX_DB_PASSWORD: ${SMARTLOGIX_DB_PASSWORD}
      SMARTLOGIX_JWT_SECRET: ${SMARTLOGIX_JWT_SECRET}
      SMARTLOGIX_JWT_ISSUER: ${SMARTLOGIX_JWT_ISSUER:-smartlogix-identity-service}
      SMARTLOGIX_SERVICEBUS_HOST: ${SMARTLOGIX_SERVICEBUS_HOST:-sb-smartlogix-ns.servicebus.windows.net}
      SMARTLOGIX_SERVICEBUS_POLICY: ${SMARTLOGIX_SERVICEBUS_POLICY:-smartlogix-app}
      SMARTLOGIX_SERVICEBUS_KEY: ${SMARTLOGIX_SERVICEBUS_KEY}
    depends_on:
      postgres-inventory:
        condition: service_healthy
    networks:
      - smartlogix-net

  shipping:
    image: smartlogix2026acr.azurecr.io/smartlogix/shipping-service:azure
    ports:
      - "8083:8083"
    environment:
      JAVA_TOOL_OPTIONS: ${SMARTLOGIX_JVM_OPTS:--Xmx512m}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-shipping:5432/smartlogix_shipping_db
      SMARTLOGIX_DB_USERNAME: ${SMARTLOGIX_DB_USERNAME:-smartlogix}
      SMARTLOGIX_DB_PASSWORD: ${SMARTLOGIX_DB_PASSWORD}
      SMARTLOGIX_JWT_SECRET: ${SMARTLOGIX_JWT_SECRET}
      SMARTLOGIX_JWT_ISSUER: ${SMARTLOGIX_JWT_ISSUER:-smartlogix-identity-service}
      SMARTLOGIX_SERVICEBUS_HOST: ${SMARTLOGIX_SERVICEBUS_HOST:-sb-smartlogix-ns.servicebus.windows.net}
      SMARTLOGIX_SERVICEBUS_POLICY: ${SMARTLOGIX_SERVICEBUS_POLICY:-smartlogix-app}
      SMARTLOGIX_SERVICEBUS_KEY: ${SMARTLOGIX_SERVICEBUS_KEY}
    depends_on:
      postgres-shipping:
        condition: service_healthy
    networks:
      - smartlogix-net

  sb-admin:
    image: smartlogix2026acr.azurecr.io/smartlogix/sb-admin-service:azure
    ports:
      - "8085:8085"
    environment:
      JAVA_TOOL_OPTIONS: ${SMARTLOGIX_JVM_OPTS:--Xmx512m}
      SMARTLOGIX_SERVICEBUS_HOST: ${SMARTLOGIX_SERVICEBUS_HOST:-sb-smartlogix-ns.servicebus.windows.net}
      SMARTLOGIX_SERVICEBUS_POLICY: smartlogix-admin
      SMARTLOGIX_SERVICEBUS_KEY: ${SMARTLOGIX_SERVICEBUS_ADMIN_KEY}
    networks:
      - smartlogix-net

  postgres-identity:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: smartlogix_identity_db
      POSTGRES_USER: ${SMARTLOGIX_DB_USERNAME:-smartlogix}
      POSTGRES_PASSWORD: ${SMARTLOGIX_DB_PASSWORD}
    volumes:
      - postgres-identity-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${SMARTLOGIX_DB_USERNAME:-smartlogix} -d smartlogix_identity_db"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - smartlogix-net

  postgres-order:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: smartlogix_order_db
      POSTGRES_USER: ${SMARTLOGIX_DB_USERNAME:-smartlogix}
      POSTGRES_PASSWORD: ${SMARTLOGIX_DB_PASSWORD}
    volumes:
      - postgres-order-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${SMARTLOGIX_DB_USERNAME:-smartlogix} -d smartlogix_order_db"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - smartlogix-net

  postgres-inventory:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: smartlogix_inventory_db
      POSTGRES_USER: ${SMARTLOGIX_DB_USERNAME:-smartlogix}
      POSTGRES_PASSWORD: ${SMARTLOGIX_DB_PASSWORD}
    volumes:
      - postgres-inventory-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${SMARTLOGIX_DB_USERNAME:-smartlogix} -d smartlogix_inventory_db"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - smartlogix-net

  postgres-shipping:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: smartlogix_shipping_db
      POSTGRES_USER: ${SMARTLOGIX_DB_USERNAME:-smartlogix}
      POSTGRES_PASSWORD: ${SMARTLOGIX_DB_PASSWORD}
    volumes:
      - postgres-shipping-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${SMARTLOGIX_DB_USERNAME:-smartlogix} -d smartlogix_shipping_db"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - smartlogix-net

volumes:
  postgres-identity-data:
  postgres-order-data:
  postgres-inventory-data:
  postgres-shipping-data:

networks:
  smartlogix-net:
    driver: bridge